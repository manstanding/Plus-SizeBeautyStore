name: Publish PLUS SIZE BEAUTY website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Verify homepage and required assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class References(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  for k in ('src','href'):
                      if k in a: self.refs.append(a[k])
          pages=list(Path('.').glob('*.html'))
          assert len(pages)>=10, f'Expected 10 pages, found {len(pages)}'
          missing=[]
          for page in pages:
              parser=References(); parser.feed(page.read_text(encoding='utf-8'))
              for ref in parser.refs:
                  path=ref.split('?',1)[0].split('#',1)[0]
                  if not path or path.startswith(('https://','http://','mailto:','tel:','data:','/')): continue
                  if not (page.parent / path).exists(): missing.append(f'{page}: {path}')
          assert not missing, 'Missing files: '+', '.join(missing)
          homepage=Path('index.html').read_text(encoding='utf-8')
          assert 'hero-women.jpg' in homepage and 'photo-grid' in homepage, 'Approved photography homepage not found'
          assert Path('CNAME').read_text().strip()=='plus-sizebeautystore.com'
          print(f'PASS: {len(pages)} pages, links/assets exist, photography homepage and domain file confirmed')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public homepage after deployment
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url='https://plus-sizebeautystore.com/'
          expected='Real women.'
          for attempt in range(1,13):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PLUS-SIZE-BEAUTY-deployment-check','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      html=response.read().decode('utf-8','replace')
                  if expected in html and 'hero-women.jpg' in html:
                      print('PASS: public domain serves approved photography homepage')
                      break
                  print(f'Attempt {attempt}: domain responds but is still serving a different homepage')
              except Exception as exc:
                  print(f'Attempt {attempt}: {type(exc).__name__}: {exc}')
              if attempt==12:
                  raise SystemExit('DEPLOYMENT NOT VERIFIED: check Pages source, custom domain, and DNS/hosting. Do not modify MX email records.')
              time.sleep(10)
          PY
      - name: Diagnose domain routing if public check fails
        if: failure()
        run: |
          echo "Public domain DNS:"
          (dig +short plus-sizebeautystore.com A || true)
          (dig +short www.plus-sizebeautystore.com CNAME || true)
          echo "Public homepage response headers:"
          (curl -sSIL --max-time 20 https://plus-sizebeautystore.com/ || true)
          echo "GitHub Pages expected A records: 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153"
          echo "Do not change MX, SPF, DKIM or other business-email DNS records."
